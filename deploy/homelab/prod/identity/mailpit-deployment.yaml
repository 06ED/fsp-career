apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsp-career-mailpit
  namespace: fsp-career
  labels:
    app.kubernetes.io/name: fsp-career-mailpit
    app.kubernetes.io/part-of: fsp-career
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fsp-career-mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fsp-career-mailpit
        app.kubernetes.io/part-of: fsp-career
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: goodman
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.4
          ports:
            - name: http
              containerPort: 8025
            - name: smtp
              containerPort: 1025
          env:
            - name: MP_WEBROOT
              value: /mail/
            - name: MP_MAX_MESSAGES
              value: "100"
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
