openapi: 3.0.3
info:
  title: FSP Career API
  version: 2.0.0
  description: >-
    JSON API. Every /api route requires a valid Keycloak access token with issuer
    KEYCLOAK_ISSUER and audience KEYCLOAK_AUDIENCE. After the first login the user chooses
    an application role once (POST /api/me/role); role-specific routes return 403 until then
    or for the other role. Errors have the same JSON shape at every API endpoint.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MatchingSpecialization:
      {in: query, name: specialization, schema: {type: string, maxLength: 100}, description: 'Need mode: overrides the need specialization. Bank mode: filter by specialization.'}
    MatchingGrade:
      {in: query, name: grade, schema: {type: string, enum: [junior, middle, senior]}, description: 'Need mode: required grade (overrides the need; exact fit ranks first, higher grades get ×0.85/×0.70, lower excluded unless allowLowerGrade). Bank mode: exact assessed grade.'}
    MatchingCategory:
      {in: query, name: category, schema: {type: string, pattern: '^[^:]+:(junior|middle|senior)$', example: 'backend:middle'}, description: 'Category key = specialization:grade; sets both specialization and grade.'}
    MatchingTechStack:
      {in: query, name: techStack, schema: {type: string, example: 'Kotlin,PostgreSQL'}, description: 'Comma-separated, at most 10 skills of ≤100 chars; ALL must be in the candidate''s visible listed stack (case- and alias-insensitive: Postgres = PostgreSQL).'}
    MatchingVerifiedAchievements:
      {in: query, name: verifiedAchievements, schema: {type: boolean}, description: True keeps only candidates with at least one visible verified (FSP) achievement. Alias `fsp`.}
    MatchingFsp:
      {in: query, name: fsp, schema: {type: boolean}, description: Alias of verifiedAchievements.}
    MatchingIndustry:
      {in: query, name: industry, schema: {type: string, maxLength: 100}, description: Hard filter on the candidate industry (stemmed term match).}
    MatchingQuery:
      {in: query, name: q, schema: {type: string, maxLength: 300}, description: 'Need mode: free text appended to the need description for TF-IDF relevance (refinement). Bank mode: keeps candidates whose experience or listed stack matches the text; order stays by profile strength.'}
    MatchingAllowLowerGrade:
      {in: query, name: allowLowerGrade, schema: {type: boolean}, description: 'Need mode only: include candidates one grade below the required one (×0.60, flagged).'}
    MatchingLimit:
      {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}, description: Maximum number of returned candidates; `total` reports how many matched.}
    CandidateId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Me:
      type: object
      properties:
        role: {type: string, enum: [candidate, employer], nullable: true, description: null until chosen}
        email: {type: string}
        emailVerified: {type: boolean}
    RoleChoice:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [candidate, employer]}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    CvEntry:
      type: object
      properties:
        company: {type: string, maxLength: 200}
        role: {type: string, maxLength: 200}
        startDate: {type: string, maxLength: 30}
        endDate: {type: string, maxLength: 30}
        description: {type: string, maxLength: 2000}
    Candidate:
      type: object
      properties:
        fullName: {type: string, maxLength: 200}
        email: {type: string, description: Verified Keycloak email only; supplied values must match verified claim}
        phone: {type: string, maxLength: 50}
        processingConsent: {type: boolean, description: "Required true for profile update, assessment and resume upload"}
        consentPublication: {type: boolean, description: Independent opt-in for employer discoverability}
        specialization: {type: string, maxLength: 100}
        industry: {type: string, maxLength: 100}
        desiredGrade: {type: string, enum: [junior, middle, senior]}
        grade: {type: string, nullable: true, readOnly: true, enum: [junior, middle, senior]}
        score: {type: integer, nullable: true, readOnly: true, minimum: 0, maximum: 100}
        techStack: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        experience: {type: string, maxLength: 4000}
        softSkills: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        targetRoles: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        cvHistory: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/CvEntry'}}
    ResumeFields:
      type: object
      properties:
        fullName: {type: string}
        email: {type: string, description: Unverified suggestion; never applied as profile email}
        phone: {type: string}
        experience: {type: string}
        techStack: {type: array, items: {type: string}}
        softSkills: {type: array, items: {type: string}}
        targetRoles: {type: array, items: {type: string}}
        cvHistory: {type: array, items: {$ref: '#/components/schemas/CvEntry'}}
    ResumeDraft:
      type: object
      required: [draftId, parsedFields, reviewed]
      properties:
        draftId: {type: string, format: uuid}
        parsedFields: {$ref: '#/components/schemas/ResumeFields'}
        reviewed: {type: boolean, enum: [false]}
    ConfirmResume:
      type: object
      required: [draftId]
      properties:
        draftId: {type: string, format: uuid}
        fullName: {type: string, maxLength: 200}
        phone: {type: string, maxLength: 50}
        experience: {type: string, maxLength: 4000}
        techStack: {type: array, items: {type: string}}
        softSkills: {type: array, items: {type: string}}
        targetRoles: {type: array, items: {type: string}}
        cvHistory: {type: array, items: {$ref: '#/components/schemas/CvEntry'}}
    Option:
      type: object
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    Question:
      type: object
      required: [id, prompt, options]
      description: Correct answer is never included in API responses.
      properties:
        id: {type: integer, format: int64}
        prompt: {type: string}
        options: {type: array, items: {$ref: '#/components/schemas/Option'}}
    QuestionSet:
      type: object
      required: [attemptId, questions, expiresAt]
      properties:
        attemptId: {type: string, format: uuid}
        questions: {type: array, minItems: 5, maxItems: 5, items: {$ref: '#/components/schemas/Question'}}
        expiresAt: {type: string, format: date-time}
    Answer:
      type: object
      required: [questionId, optionId]
      properties:
        questionId: {type: integer, format: int64}
        optionId: {type: string}
    Submission:
      type: object
      required: [attemptId, answers]
      properties:
        attemptId: {type: string, format: uuid}
        answers: {type: array, minItems: 5, maxItems: 5, items: {$ref: '#/components/schemas/Answer'}}
    AssessmentResult:
      type: object
      required: [score, grade, specialization, submittedAt]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        grade: {type: string, enum: [junior, middle, senior]}
        specialization: {type: string}
        submittedAt: {type: string, format: date-time}
    AssessmentHistory:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/AssessmentResult'}}
    Company:
      type: object
      description: Employer company profile. Contact fields form the default contact method of invitations.
      properties:
        name: {type: string, maxLength: 200, description: Required on PUT}
        description: {type: string, maxLength: 2000}
        website: {type: string, maxLength: 500, description: 'Empty or http(s):// URL'}
        industry: {type: string, maxLength: 100, description: Line of business (направление деятельности)}
        contactEmail: {type: string, maxLength: 320, description: Empty or a valid e-mail}
        contactPhone: {type: string, description: 'Empty or phone: +, digits, spaces, (), - (6..25 chars)'}
        contactTelegram: {type: string, description: '@handle (5..32 chars); t.me links are normalised to @handle'}
        contactNote: {type: string, maxLength: 300, description: Free-text contact method line}
    Need:
      type: object
      properties:
        specialization: {type: string, maxLength: 100}
        industry: {type: string, maxLength: 100}
        minGrade: {type: string, enum: [junior, middle, senior], description: Required grade (name kept for compatibility)}
        description: {type: string, maxLength: 2000, description: What the team does and the tasks; used for TF-IDF relevance}
        techStack: {type: array, maxItems: 15, items: {type: string, maxLength: 50}, description: Required stack; deduplicated case-insensitively}
    Achievement:
      type: object
      required: [title, issuer, points]
      description: Server-side verified achievement; users cannot submit these through the API.
      properties:
        title: {type: string}
        issuer: {type: string}
        points: {type: integer, minimum: 1, maximum: 20}
    VerifiedAchievement:
      type: object
      required: [title, issuer, points, source]
      description: Server-side verified achievement (FSP registry import or back-office record). Never accepted from users.
      properties:
        title: {type: string}
        issuer: {type: string}
        points: {type: integer, minimum: 1, maximum: 20, description: 'FSP policy: base by level (international 10, federal 7, regional 4) × outcome (winner 1.6, prize 1.3, finalist 1.0, participant 0.5), rounded, 1..20'}
        source: {type: string, description: '`fsp` for registry imports, `manual` for older verified records'}
        eventName: {type: string, nullable: true}
        discipline: {type: string, nullable: true}
        eventDate: {type: string, format: date, nullable: true}
        level: {type: string, nullable: true, enum: [regional, federal, international, null]}
        levelLabel: {type: string, nullable: true}
        place: {type: integer, nullable: true}
        result: {type: string, nullable: true, enum: [winner, prize, finalist, participant, null]}
        resultLabel: {type: string, nullable: true}
    MatchingFactor:
      type: object
      required: [code, label, weight, value, points, text]
      description: One explainable ranking factor. `points = weight × value`; `grade` is a multiplier (value) with weight 0.
      properties:
        code: {type: string, enum: [test, text, stack, fsp, industry, freshness, grade]}
        label: {type: string}
        weight: {type: number, description: Maximum points after rescaling inapplicable factors away (sums to 100 per candidate)}
        value: {type: number, minimum: 0, maximum: 1}
        points: {type: number}
        text: {type: string, description: Russian explanation, e.g. «Стек 3 из 4 — Kotlin, PostgreSQL, Kafka; нет Docker»}
    MatchingCandidate:
      type: object
      required: [candidateId, fullName, specialization, grade, category, score, achievementScore, totalScore, relevance, strength, explanation, factors, flags, achievements, techStack, industry, fspLinked]
      description: Ranked candidate. Never contains e-mail or phone.
      properties:
        candidateId: {type: string, format: uuid}
        fullName: {type: string, description: Name or «Кандидат №XXXXXX» when the candidate hides it}
        specialization: {type: string}
        grade: {type: string, enum: [junior, middle, senior], description: Assessed grade (never self-declared)}
        category: {type: string, description: Category label (specialization · grade)}
        score: {type: integer, minimum: 0, maximum: 100, description: Confirmed test score}
        achievementScore: {type: integer, description: Sum of visible verified achievement points capped at 20}
        totalScore: {type: integer, description: Rounded relevance (need mode) or strength (bank mode)}
        relevance: {type: number, description: 'Need mode: gradeFit × Σ factor points (0..100)'}
        strength: {type: number, description: 'Confirmed-profile strength = 65·test + 25·FSP + 10·freshness (0..100)'}
        explanation: {type: string, description: Short Russian summary of the factors}
        factors: {type: array, items: {$ref: '#/components/schemas/MatchingFactor'}}
        flags: {type: array, items: {type: string}, description: 'Russian notes: «Нет истории ФСП», «Грейд выше требуемого…», stuffing hint, stale profile'}
        achievements: {type: array, items: {$ref: '#/components/schemas/VerifiedAchievement'}}
        techStack: {type: array, items: {type: string}, description: Visible self-reported stack}
        industry: {type: string}
        fspLinked: {type: boolean}
        lastActiveAt: {type: string, format: date-time, nullable: true}
        assessedAt: {type: string, format: date-time, nullable: true}
        invitationStatus: {type: string, nullable: true, enum: [sent, viewed, accepted, rejected, null], description: Latest invitation from this employer}
    MatchingCategory:
      type: object
      required: [key, specialization, grade, label, candidates, withFsp, avgTestScore, avgStrength, fit, recommended, reason]
      properties:
        key: {type: string, example: 'backend:middle'}
        specialization: {type: string}
        grade: {type: string, enum: [junior, middle, senior]}
        label: {type: string}
        candidates: {type: integer}
        withFsp: {type: integer}
        avgTestScore: {type: integer}
        avgStrength: {type: integer}
        fit: {type: string, enum: [exact, higher, lower, adjacent, browse]}
        recommended: {type: boolean}
        reason: {type: string}
        avgTextRelevance: {type: number, nullable: true, description: Mean of the top-3 TF-IDF cosines of the category to the need}
    MatchingResponse:
      type: object
      required: [mode, total, categories, matches, formula]
      properties:
        mode: {type: string, enum: [need, bank]}
        need:
          type: object
          nullable: true
          description: Effective need (after query overrides); null in bank mode
          properties:
            specialization: {type: string}
            grade: {type: string}
            industry: {type: string}
            techStack: {type: array, items: {type: string}}
            description: {type: string}
            query: {type: string}
        total: {type: integer, description: Number of candidates that passed the gate and filters}
        categories: {type: array, items: {$ref: '#/components/schemas/MatchingCategory'}, description: 'Need mode: recommended categories for the need (exact, higher, lower, adjacent by text). Bank mode: all categories.'}
        matches: {type: array, items: {$ref: '#/components/schemas/MatchingCandidate'}}
        formula: {type: array, items: {type: string}, description: Russian description of the ranking formula for the UI}
    MatchingCandidateCard:
      type: object
      required: [candidateId, fullName, specialization, industry, hiddenSections, contactsDisclosed, invitations]
      description: Employer-facing card. Hidden sections are null; contacts only after the candidate accepted an invitation from this employer.
      properties:
        candidateId: {type: string, format: uuid}
        fullName: {type: string}
        specialization: {type: string}
        grade: {type: string, nullable: true}
        score: {type: integer, nullable: true}
        assessedAt: {type: string, format: date-time, nullable: true}
        category: {type: string, nullable: true}
        industry: {type: string}
        techStack: {type: array, nullable: true, items: {type: string}}
        experience: {type: string, nullable: true}
        targetRoles: {type: array, nullable: true, items: {type: string}}
        cvHistory: {type: array, nullable: true, items: {$ref: '#/components/schemas/CvEntry'}}
        softSkills: {type: array, nullable: true, items: {type: string}}
        achievements: {type: array, nullable: true, items: {$ref: '#/components/schemas/VerifiedAchievement'}}
        fspLinked: {type: boolean, nullable: true}
        hiddenSections: {type: array, items: {type: string}}
        lastActiveAt: {type: string, format: date-time, nullable: true}
        contactsDisclosed: {type: boolean}
        contactEmail: {type: string, nullable: true}
        contactPhone: {type: string, nullable: true}
        invitations:
          type: array
          items:
            type: object
            required: [id, status, createdAt, salaryMinRub, salaryMaxRub]
            properties:
              id: {type: string, format: uuid}
              status: {type: string, enum: [sent, viewed, accepted, rejected]}
              createdAt: {type: string, format: date-time}
              salaryMinRub: {type: integer}
              salaryMaxRub: {type: integer}
        match: {allOf: [{$ref: '#/components/schemas/MatchingCandidate'}], nullable: true, description: Explanation against the employer's saved need}
    CandidatePrivacy:
      type: object
      description: What employers see. Hidden sections are not shown and not used for ranking. Defaults are all true (publication itself is a separate opt-in).
      properties:
        fullName: {type: boolean, default: true}
        techStack: {type: boolean, default: true}
        experience: {type: boolean, default: true, description: Experience text and target roles}
        cvHistory: {type: boolean, default: true}
        softSkills: {type: boolean, default: true}
        fspAchievements: {type: boolean, default: true}
    FspLinkRequest:
      type: object
      required: [fspId]
      properties:
        fspId: {type: string, example: FSP-100001, description: 'FSP-123456; also accepts fsp 123456 or 123456'}
    FspStatus:
      type: object
      required: [linked, registry, achievements, totalPoints, message]
      properties:
        linked: {type: boolean}
        fspId: {type: string, nullable: true}
        linkedAt: {type: string, format: date-time, nullable: true}
        registry: {type: string, description: Registry connector name (currently the synthetic demo registry)}
        achievements: {type: array, items: {$ref: '#/components/schemas/VerifiedAchievement'}}
        totalPoints: {type: integer}
        message: {type: string, description: Russian status text, including the no-FSP-history case}
    InviteRequest:
      type: object
      required: [candidateId, description, salaryMinRub, salaryMaxRub]
      properties:
        candidateId: {type: string, format: uuid}
        description: {type: string, minLength: 1, maxLength: 4000}
        salaryMinRub: {type: integer, minimum: 1}
        salaryMaxRub: {type: integer, minimum: 1, description: Must be at least salaryMinRub}
        contactMethod: {type: string, maxLength: 300, description: How the candidate should contact the company; defaults to the company contact line. 400 if both are empty.}
    Invitation:
      type: object
      required: [id, candidateId, employerId, description, salaryMinRub, salaryMaxRub, status, createdAt, companyName, candidateName]
      properties:
        id: {type: string, format: uuid}
        candidateId: {type: string, format: uuid}
        employerId: {type: string, format: uuid}
        description: {type: string}
        salaryMinRub: {type: integer}
        salaryMaxRub: {type: integer}
        status: {type: string, enum: [sent, viewed, accepted, rejected]}
        createdAt: {type: string, format: date-time}
        companyName: {type: string}
        candidateName: {type: string, description: «Кандидат №XXXXXX» while the candidate hides the name and contacts are closed}
        contactEmail: {type: string, nullable: true, description: Null until the candidate accepted an invitation from this employer}
        contactPhone: {type: string, nullable: true, description: Null until the candidate accepted an invitation from this employer}
        contactMethod: {type: string, description: Company contact method shown to the candidate (stored with the invitation)}
    Invitations:
      type: object
      required: [invitations]
      properties:
        invitations: {type: array, items: {$ref: '#/components/schemas/Invitation'}}
    # ---- Vacancies, applications, short tasks (VacancyRoutes.kt / TaskRoutes.kt) ----
    VacancySpecialization:
      type: string
      enum: [backend, frontend, data, product, design]
      description: Same dictionary as candidate profiles and the assessment bank.
    VacancyRequest:
      type: object
      required: [title, description, specialization, grade, salaryMinRub, salaryMaxRub, workFormat]
      description: Salary range "от–до" in RUB is mandatory (spec 2.2 rule 1); city is required unless workFormat is remote.
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 6000}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, enum: [junior, middle, senior], description: Required confirmed grade}
        techStack: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 60}, description: De-duplicated case-insensitively}
        salaryMinRub: {type: integer, minimum: 1}
        salaryMaxRub: {type: integer, minimum: 1, maximum: 10000000, description: Must be at least salaryMinRub}
        workFormat: {type: string, enum: [office, remote, hybrid]}
        city: {type: string, maxLength: 100}
    VacancyApplicationCounts:
      type: object
      required: [total, sent, viewed, accepted, rejected]
      properties:
        total: {type: integer}
        sent: {type: integer}
        viewed: {type: integer}
        accepted: {type: integer}
        rejected: {type: integer}
    EmployerVacancy:
      type: object
      required: [id, title, description, specialization, grade, techStack, salaryMinRub, salaryMaxRub, workFormat, city, status, createdAt, updatedAt, applications]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, enum: [junior, middle, senior]}
        techStack: {type: array, items: {type: string}}
        salaryMinRub: {type: integer}
        salaryMaxRub: {type: integer}
        workFormat: {type: string, enum: [office, remote, hybrid]}
        city: {type: string}
        status: {type: string, enum: [open, closed]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        applications: {$ref: '#/components/schemas/VacancyApplicationCounts'}
    EmployerVacancies:
      type: object
      required: [vacancies]
      properties:
        vacancies: {type: array, items: {$ref: '#/components/schemas/EmployerVacancy'}}
    VacancyCard:
      type: object
      description: Open vacancy as a candidate sees it, with conditions and company before any conversation.
      required: [id, title, description, specialization, grade, techStack, salaryMinRub, salaryMaxRub, workFormat, city, companyName, companyDescription, companyWebsite, createdAt, categoryMatch, stackOverlap, fit]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, enum: [junior, middle, senior]}
        techStack: {type: array, items: {type: string}}
        salaryMinRub: {type: integer}
        salaryMaxRub: {type: integer}
        workFormat: {type: string, enum: [office, remote, hybrid]}
        city: {type: string}
        companyName: {type: string}
        companyDescription: {type: string}
        companyWebsite: {type: string}
        createdAt: {type: string, format: date-time}
        categoryMatch: {type: boolean, description: Same specialization and assessed grade >= required grade}
        stackOverlap: {type: array, items: {type: string}, description: Vacancy skills present in the candidate's self-reported stack}
        fit: {type: string, description: Russian explanation of the category fit and stack overlap}
        myApplicationId: {type: string, format: uuid, nullable: true}
        myApplicationStatus: {type: string, nullable: true, enum: [sent, viewed, accepted, rejected]}
    VacancyCards:
      type: object
      required: [vacancies]
      properties:
        vacancies: {type: array, items: {$ref: '#/components/schemas/VacancyCard'}}
    VacancyApplyRequest:
      type: object
      properties:
        coverNote: {type: string, maxLength: 2000}
    CandidateVacancyApplication:
      type: object
      required: [id, vacancyId, vacancyTitle, vacancyStatus, companyName, specialization, grade, salaryMinRub, salaryMaxRub, workFormat, city, coverNote, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        vacancyId: {type: string, format: uuid}
        vacancyTitle: {type: string}
        vacancyStatus: {type: string, enum: [open, closed]}
        companyName: {type: string}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, enum: [junior, middle, senior]}
        salaryMinRub: {type: integer}
        salaryMaxRub: {type: integer}
        workFormat: {type: string, enum: [office, remote, hybrid]}
        city: {type: string}
        coverNote: {type: string}
        status: {type: string, enum: [sent, viewed, accepted, rejected]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CandidateVacancyApplications:
      type: object
      required: [applications]
      properties:
        applications: {type: array, items: {$ref: '#/components/schemas/CandidateVacancyApplication'}}
    VacancyApplicant:
      type: object
      description: >-
        Applicant as the vacancy owner sees it. Contacts are included because the candidate applied
        to this employer (spec 2.2 rule 2); withdrawal deletes the application and the disclosure.
      required: [id, vacancyId, candidateId, fullName, specialization, techStack, experience, coverNote, status, createdAt, updatedAt, contactEmail, contactPhone, categoryMatch, stackOverlap, fit, taskSubmissions]
      properties:
        id: {type: string, format: uuid}
        vacancyId: {type: string, format: uuid}
        candidateId: {type: string, format: uuid}
        fullName: {type: string}
        specialization: {type: string}
        assessedGrade: {type: string, nullable: true, enum: [junior, middle, senior], description: Best confirmed grade in the current specialization}
        score: {type: integer, nullable: true, minimum: 0, maximum: 100}
        techStack: {type: array, items: {type: string}}
        experience: {type: string}
        coverNote: {type: string}
        status: {type: string, enum: [sent, viewed, accepted, rejected]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        contactEmail: {type: string, description: Verified e-mail}
        contactPhone: {type: string}
        categoryMatch: {type: boolean}
        stackOverlap: {type: array, items: {type: string}}
        fit: {type: string, description: 'Russian explanation: category, stack overlap and short-task activity'}
        taskSubmissions: {type: integer}
        taskAverageRating: {type: number, nullable: true, minimum: 1, maximum: 5}
        lastTaskActivityAt: {type: string, format: date-time, nullable: true}
    VacancyApplicants:
      type: object
      required: [vacancy, applications]
      properties:
        vacancy: {$ref: '#/components/schemas/EmployerVacancy'}
        applications:
          type: array
          description: Sorted by category match, assessed grade, score, then earliest application.
          items: {$ref: '#/components/schemas/VacancyApplicant'}
    VacancyApplicationStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [viewed, accepted, rejected], description: 'Allowed: sent→viewed, sent|viewed→accepted, sent|viewed→rejected'}
    ShortTaskRequest:
      type: object
      required: [title, body, specialization]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 4000}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, nullable: true, enum: [junior, middle, senior], description: Null offers the task to every grade}
    EmployerShortTask:
      type: object
      required: [id, title, body, specialization, active, createdAt, submissions, unrated]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, nullable: true, enum: [junior, middle, senior]}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        submissions: {type: integer}
        unrated: {type: integer}
    EmployerShortTasks:
      type: object
      required: [tasks]
      properties:
        tasks: {type: array, items: {$ref: '#/components/schemas/EmployerShortTask'}}
    OfferedShortTask:
      type: object
      required: [id, title, body, specialization, companyName]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        specialization: {$ref: '#/components/schemas/VacancySpecialization'}
        grade: {type: string, nullable: true, enum: [junior, middle, senior]}
        companyName: {type: string}
    CurrentShortTask:
      type: object
      required: [periodStart, nextRotationAt, state]
      properties:
        periodStart: {type: string, format: date, description: Monday of the current UTC week}
        nextRotationAt: {type: string, format: date-time, description: Next Monday 00:00 UTC}
        state: {type: string, enum: [offered, answered, none]}
        task: {allOf: [{$ref: '#/components/schemas/OfferedShortTask'}], nullable: true}
        submission: {allOf: [{$ref: '#/components/schemas/CandidateTaskSubmission'}], nullable: true}
        lastActivityAt: {type: string, format: date-time, nullable: true}
    TaskSubmissionRequest:
      type: object
      required: [taskId, kind, answer]
      properties:
        taskId: {type: string, format: uuid, description: Must equal the current weekly task}
        kind: {type: string, enum: [solution, approach], description: Full solution or proposed approach}
        answer: {type: string, minLength: 1, maxLength: 8000}
    CandidateTaskSubmission:
      type: object
      required: [id, taskId, taskTitle, companyName, kind, answer, submittedAt, ratingComment]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        taskTitle: {type: string}
        companyName: {type: string}
        kind: {type: string, enum: [solution, approach]}
        answer: {type: string}
        submittedAt: {type: string, format: date-time}
        rating: {type: integer, nullable: true, minimum: 1, maximum: 5}
        ratingComment: {type: string}
        ratedAt: {type: string, format: date-time, nullable: true}
    CandidateTaskSubmissions:
      type: object
      required: [submissions]
      properties:
        submissions: {type: array, items: {$ref: '#/components/schemas/CandidateTaskSubmission'}}
    EmployerTaskSubmission:
      type: object
      description: Answer as the task author sees it; contacts are never included.
      required: [id, taskId, candidateId, candidateName, specialization, kind, answer, submittedAt, ratingComment]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        candidateId: {type: string, format: uuid}
        candidateName: {type: string}
        specialization: {type: string}
        assessedGrade: {type: string, nullable: true, enum: [junior, middle, senior]}
        score: {type: integer, nullable: true}
        kind: {type: string, enum: [solution, approach]}
        answer: {type: string}
        submittedAt: {type: string, format: date-time}
        rating: {type: integer, nullable: true, minimum: 1, maximum: 5}
        ratingComment: {type: string}
        ratedAt: {type: string, format: date-time, nullable: true}
    EmployerTaskSubmissions:
      type: object
      required: [task, submissions]
      properties:
        task: {$ref: '#/components/schemas/EmployerShortTask'}
        submissions: {type: array, items: {$ref: '#/components/schemas/EmployerTaskSubmission'}}
    TaskRatingRequest:
      type: object
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, maxLength: 1000}
  responses:
    BadRequest:
      description: Malformed JSON, invalid fields, missing consent, or invalid PDF.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: Missing, expired, invalid-signature, or incorrect-audience bearer token.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Insufficient role or candidate processing consent.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource does not exist or is not owned by this principal.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Retake cooldown, expired attempt, or invalid invitation status transition.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InternalError:
      description: Unexpected server failure.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /health:
    get:
      summary: Public process liveness check
      security: []
      responses:
        '200': {description: Alive, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /openapi.yaml:
    get:
      summary: Public OpenAPI 3 specification
      security: []
      responses:
        '200': {description: YAML specification, content: {application/yaml: {schema: {type: string}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/me:
    get:
      summary: Current user and the application role bound to the account (null before the first choice)
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/me/role:
    post:
      summary: Choose the account role once (candidate or employer); repeating the same choice is idempotent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleChoice'}}}}
      responses:
        '200': {description: Bound role, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me:
    get:
      summary: Read own candidate profile (candidate role)
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Update own profile with processingConsent true; publication consent is independent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/consent:
    delete:
      summary: Revoke processing and erase own profile, assessment answers, drafts, achievements and invitations
      description: The blank account remains and can opt in again through PUT /api/candidates/me. Vacancy applications, short-task answers and weekly task offers are erased too. The FSP ID link is removed and privacy settings reset.
      responses:
        '200': {description: Cleared profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/resume.pdf:
    get:
      summary: Download own standardized branded PDF resume (candidate role)
      description: Requires processing consent and nonblank fullName; generated on demand without persisting PDF. Unicode font is bundled.
      responses:
        '200':
          description: Downloadable PDF resume
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="fsp-resume.pdf"'}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/resume-upload:
    post:
      summary: Extract review-only suggestions from text-based PDF (candidate role, processing consent required)
      description: Exactly one file part named file; at most 5 MB and 30 readable pages. No PDF file persists.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Unreviewed draft, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeDraft'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/resume-confirm:
    post:
      summary: Explicitly review/edit draft fields and save profile; verified email and publication consent stay unchanged
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmResume'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/history:
    get:
      summary: Own submitted assessment results, newest first (candidate role)
      responses:
        '200': {description: Results, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentHistory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/questions:
    get:
      summary: Begin or resume random five-question assessment (candidate role)
      description: Three specialty and two general questions for known specialties; otherwise five general. Attempt expires in 30 minutes. Completed assessments impose a 90-day cooldown.
      responses:
        '200': {description: Questions without answer key, content: {application/json: {schema: {$ref: '#/components/schemas/QuestionSet'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments:
    post:
      summary: Submit complete answer set (candidate role); grade in same specialization cannot decrease
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
      responses:
        '201': {description: Assessed result, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/company:
    get:
      summary: Read own employer company (employer role)
      responses:
        '200': {description: Company, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Update own employer company (employer role)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
      responses:
        '200': {description: Updated company, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/needs:
    get:
      summary: Read own hiring needs (employer role)
      responses:
        '200': {description: Hiring needs, content: {application/json: {schema: {$ref: '#/components/schemas/Need'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Update own hiring needs (employer role)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Need'}}}}
      responses:
        '200': {description: Updated hiring needs, content: {application/json: {schema: {$ref: '#/components/schemas/Need'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/matches:
    get:
      summary: Need-based selection ranked by relevance, with explanations and recommended categories (employer role)
      description: >-
        Category gate: published candidates with an assessed category in the need specialization; required grade
        exact ×1.00, one higher ×0.85, two higher ×0.70, lower excluded unless allowLowerGrade (×0.60).
        Relevance = gradeFit × (test 30 + TF-IDF text 25 + stack 20 + FSP 15 + industry 5 + freshness 5), inapplicable
        factors rescaled away. Ties: relevance, strength, candidate id. Every result carries factors and a Russian explanation.
      parameters:
        - {$ref: '#/components/parameters/MatchingSpecialization'}
        - {$ref: '#/components/parameters/MatchingGrade'}
        - {$ref: '#/components/parameters/MatchingCategory'}
        - {$ref: '#/components/parameters/MatchingTechStack'}
        - {$ref: '#/components/parameters/MatchingVerifiedAchievements'}
        - {$ref: '#/components/parameters/MatchingFsp'}
        - {$ref: '#/components/parameters/MatchingIndustry'}
        - {$ref: '#/components/parameters/MatchingQuery'}
        - {$ref: '#/components/parameters/MatchingAllowLowerGrade'}
        - {$ref: '#/components/parameters/MatchingLimit'}
      responses:
        '200': {description: Ranked selection, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/bank/candidates:
    get:
      summary: Search the whole candidate bank by category, ordered by confirmed-profile strength (employer role)
      description: >-
        Only published candidates with an assessed category. Strength = 65·test + 25·FSP + 10·freshness.
        Self-described data (stack, text) only filters. Returns all categories with counts.
      parameters:
        - {$ref: '#/components/parameters/MatchingSpecialization'}
        - {$ref: '#/components/parameters/MatchingGrade'}
        - {$ref: '#/components/parameters/MatchingCategory'}
        - {$ref: '#/components/parameters/MatchingTechStack'}
        - {$ref: '#/components/parameters/MatchingVerifiedAchievements'}
        - {$ref: '#/components/parameters/MatchingFsp'}
        - {$ref: '#/components/parameters/MatchingIndustry'}
        - {$ref: '#/components/parameters/MatchingQuery'}
        - {$ref: '#/components/parameters/MatchingLimit'}
      responses:
        '200': {description: Candidates ordered by strength, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/bank/candidates/{id}:
    get:
      summary: Employer-facing candidate card respecting the candidate's privacy settings (employer role)
      description: >-
        Available for published candidates, or for candidates who already disclosed contacts to this employer.
        Contacts are returned only after the candidate accepted an invitation from this employer.
      parameters: [{$ref: '#/components/parameters/CandidateId'}]
      responses:
        '200': {description: Candidate card, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingCandidateCard'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/privacy:
    get:
      summary: Read own privacy settings (candidate role)
      responses:
        '200': {description: Privacy settings, content: {application/json: {schema: {$ref: '#/components/schemas/CandidatePrivacy'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Replace own privacy settings (candidate role, processing consent required)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CandidatePrivacy'}}}}
      responses:
        '200': {description: Saved settings, content: {application/json: {schema: {$ref: '#/components/schemas/CandidatePrivacy'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/fsp:
    get:
      summary: Own FSP ID link status and imported results (candidate role)
      responses:
        '200': {description: Link status (also for candidates without FSP history), content: {application/json: {schema: {$ref: '#/components/schemas/FspStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      summary: Link (or re-sync) an FSP participant ID and import its results as verified achievements (candidate role)
      description: >-
        Ownership proof: the registry e-mail of the participant must equal the caller's verified Keycloak e-mail
        (a typed ID alone is public information). Unknown IDs and IDs of other people both return 404, so the
        endpoint does not reveal which IDs exist. Re-posting replaces previously imported results.
        Current connector: synthetic demo registry (participants *@demo.fsp.local).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FspLinkRequest'}}}}
      responses:
        '200': {description: Linked, content: {application/json: {schema: {$ref: '#/components/schemas/FspStatus'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: 'No verified e-mail in the token, processing consent missing, or wrong role', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: FSP ID already linked to another account, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      summary: Unlink the FSP ID and delete imported FSP achievements (candidate role)
      responses:
        '200': {description: Unlinked status, content: {application/json: {schema: {$ref: '#/components/schemas/FspStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/invitations:
    get:
      summary: List own role's invitations (candidate or employer)
      responses:
        '200': {description: Invitations, content: {application/json: {schema: {$ref: '#/components/schemas/Invitations'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      summary: Send invitation to published candidate with mandatory RUB salary range and a contact method (employer role)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InviteRequest'}}}}
      responses:
        '201': {description: Sent invitation, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/invitations/{id}/view:
    post:
      summary: Invited candidate marks sent invitation viewed
      parameters: [{$ref: '#/components/parameters/InvitationId'}]
      responses:
        '200': {description: Viewed invitation, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/invitations/{id}/accept:
    post:
      summary: Invited candidate accepts sent/viewed invitation; contact disclosure begins
      parameters: [{$ref: '#/components/parameters/InvitationId'}]
      responses:
        '200': {description: Accepted invitation, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/invitations/{id}/reject:
    post:
      summary: Invited candidate rejects sent/viewed invitation
      parameters: [{$ref: '#/components/parameters/InvitationId'}]
      responses:
        '200': {description: Rejected invitation, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  # ---- Vacancies and applications (VacancyRoutes.kt) ----
  /api/employers/vacancies:
    get:
      summary: List own vacancies with application counters, newest first (employer role)
      responses:
        '200': {description: Own vacancies, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerVacancies'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      summary: Publish a vacancy with a mandatory RUB salary range (employer role)
      description: The vacancy is open immediately. Requires a nonblank company name (400 otherwise).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyRequest'}}}}
      responses:
        '201': {description: Published vacancy, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerVacancy'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/vacancies/{id}:
    put:
      summary: Edit own vacancy (employer role); status is unchanged
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyRequest'}}}}
      responses:
        '200': {description: Updated vacancy, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerVacancy'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vacancy does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/vacancies/{id}/close:
    post:
      summary: Close own open vacancy (employer role); it disappears from the candidate list, applications stay
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Closed vacancy, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerVacancy'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vacancy does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Vacancy is already closed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/vacancies/{id}/reopen:
    post:
      summary: Reopen own closed vacancy (employer role)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Open vacancy, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerVacancy'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vacancy does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Vacancy is already open, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/vacancies/{id}/applications:
    get:
      summary: Incoming applications to own vacancy with category, score, fit and contacts (employer role)
      description: >-
        Contacts (verified e-mail, phone) are disclosed because each candidate applied to this vacancy.
        Sorted by confirmed-category match, assessed grade, score, then earliest application.
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Vacancy and applicants, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyApplicants'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vacancy does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/applications/{id}/status:
    put:
      summary: Change status of an application to own vacancy (employer role)
      description: 'Valid transitions: sent→viewed, sent|viewed→accepted, sent|viewed→rejected. accepted and rejected are final.'
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyApplicationStatusRequest'}}}}
      responses:
        '200': {description: Updated applicant, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyApplicant'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Application does not exist or targets another employer's vacancy, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Invalid application status transition, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/vacancies:
    get:
      summary: Browse open vacancies with company and salary range (candidate role)
      description: >-
        Recommended order: confirmed-category match, same specialization, more overlapping skills, then newest.
        At most 500 newest open vacancies are considered before in-memory skill/text filters.
      parameters:
        - {in: query, name: specialization, schema: {$ref: '#/components/schemas/VacancySpecialization'}}
        - {in: query, name: grade, schema: {type: string, enum: [junior, middle, senior]}, description: Exact required grade}
        - {in: query, name: techStack, schema: {type: string}, description: 'Comma-separated, case-insensitive; all must be in the vacancy stack (max 10)'}
        - {in: query, name: salaryFrom, schema: {type: integer, minimum: 0}, description: Vacancy salaryMaxRub must be at least this value}
        - {in: query, name: workFormat, schema: {type: string, enum: [office, remote, hybrid]}}
        - {in: query, name: q, schema: {type: string, maxLength: 100}, description: 'Case-insensitive text in title, description, company, city or stack'}
      responses:
        '200': {description: Open vacancies, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyCards'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/vacancies/{id}/applications:
    post:
      summary: Apply to an open vacancy (candidate role); discloses own contacts to that employer
      description: >-
        Requires processing consent (403), nonblank full name and specialization and at least one contact (400),
        and a completed assessment in the current specialization (409) so the employer sees a confirmed category.
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VacancyApplyRequest'}}}}
      responses:
        '201': {description: Sent application, content: {application/json: {schema: {$ref: '#/components/schemas/CandidateVacancyApplication'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Vacancy not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'Vacancy closed, already applied, or assessment not completed', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/applications:
    get:
      summary: Own applications with current status and vacancy conditions, newest first (candidate role)
      responses:
        '200': {description: Own applications, content: {application/json: {schema: {$ref: '#/components/schemas/CandidateVacancyApplications'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/applications/{id}:
    delete:
      summary: Withdraw own sent/viewed application (candidate role); the employer loses access to it and to the contacts
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Withdrawn}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Application does not exist or belongs to another candidate, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Accepted or rejected applications cannot be withdrawn, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  # ---- Regular short tasks (TaskRoutes.kt) ----
  /api/employers/tasks:
    get:
      summary: List own short tasks with answer counters (employer role)
      responses:
        '200': {description: Own tasks, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerShortTasks'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      summary: Publish a short task for a specialization, optionally for one grade (employer role)
      description: Requires a nonblank company name. Active tasks enter the weekly rotation of matching candidates.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShortTaskRequest'}}}}
      responses:
        '201': {description: Active task, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerShortTask'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/tasks/{id}/deactivate:
    post:
      summary: Remove own task from rotation (employer role); answers stay, open weekly offers are re-picked
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Inactive task, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerShortTask'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Task does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Task is already inactive, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/tasks/{id}/activate:
    post:
      summary: Return own task to rotation (employer role)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Active task, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerShortTask'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Task does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Task is already active, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/tasks/{id}/submissions:
    get:
      summary: Answers to own task with candidate name and confirmed category, never contacts (employer role)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 'Task and answers, newest first', content: {application/json: {schema: {$ref: '#/components/schemas/EmployerTaskSubmissions'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Task does not exist or belongs to another employer, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/task-submissions/{id}/rating:
    put:
      summary: Rate an answer to own task 1–5 with an optional comment; re-rating overwrites (employer role)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskRatingRequest'}}}}
      responses:
        '200': {description: Rated answer, content: {application/json: {schema: {$ref: '#/components/schemas/EmployerTaskSubmission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Answer does not exist or belongs to another employer's task, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/tasks/current:
    get:
      summary: This week's short task (candidate role; processing consent and specialization required)
      description: >-
        One task per candidate per week (Monday 00:00 UTC). On the first request of the week the system assigns
        it from active tasks of the candidate's specialization whose grade is empty or equals the candidate's
        grade (assessed, otherwise desired), excluding tasks already answered. The pick is deterministic
        (SHA-256 of candidate id and week over the sorted pool) and persisted for the week; it is re-picked
        only if the task is deactivated or the specialization changes. state=answered after answering.
      responses:
        '200': {description: Weekly slot, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentShortTask'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/task-submissions:
    get:
      summary: Own short-task answers with employer ratings, newest first (candidate role)
      responses:
        '200': {description: Own answers, content: {application/json: {schema: {$ref: '#/components/schemas/CandidateTaskSubmissions'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      summary: Answer this week's task with a solution or a proposed approach (candidate role)
      description: The answer is visible to the task's employer with name and confirmed category, without contacts.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSubmissionRequest'}}}}
      responses:
        '201': {description: Stored answer, content: {application/json: {schema: {$ref: '#/components/schemas/CandidateTaskSubmission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 'Task is not the current weekly task, or this week''s task is already answered', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
