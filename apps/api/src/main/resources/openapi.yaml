openapi: 3.0.3
info:
  title: FSP Career API
  version: 2.0.0
  description: >-
    JSON API. Every /api route requires a valid Keycloak access token with issuer
    KEYCLOAK_ISSUER, audience KEYCLOAK_AUDIENCE, and candidate or employer realm/client role.
    Accounts belong to one application role. Employer role takes precedence when both
    appear in a token. Errors have the same JSON shape at every API endpoint.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    CvEntry:
      type: object
      properties:
        company: {type: string, maxLength: 200}
        role: {type: string, maxLength: 200}
        startDate: {type: string, maxLength: 30}
        endDate: {type: string, maxLength: 30}
        description: {type: string, maxLength: 2000}
    Candidate:
      type: object
      properties:
        fullName: {type: string, maxLength: 200}
        email: {type: string, description: Verified Keycloak email only; supplied values must match verified claim}
        phone: {type: string, maxLength: 50}
        processingConsent: {type: boolean, description: Required true for profile update, assessment and resume upload}
        consentPublication: {type: boolean, description: Independent opt-in for employer discoverability}
        specialization: {type: string, maxLength: 100}
        industry: {type: string, maxLength: 100}
        desiredGrade: {type: string, enum: [junior, middle, senior]}
        grade: {type: string, nullable: true, readOnly: true, enum: [junior, middle, senior]}
        score: {type: integer, nullable: true, readOnly: true, minimum: 0, maximum: 100}
        techStack: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        experience: {type: string, maxLength: 4000}
        softSkills: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        targetRoles: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        cvHistory: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/CvEntry'}}
    ResumeFields:
      type: object
      properties:
        fullName: {type: string}
        email: {type: string, description: Unverified suggestion; never applied as profile email}
        phone: {type: string}
        experience: {type: string}
        techStack: {type: array, items: {type: string}}
        softSkills: {type: array, items: {type: string}}
        targetRoles: {type: array, items: {type: string}}
        cvHistory: {type: array, items: {$ref: '#/components/schemas/CvEntry'}}
    ResumeDraft:
      type: object
      required: [draftId, parsedFields, reviewed]
      properties:
        draftId: {type: string, format: uuid}
        parsedFields: {$ref: '#/components/schemas/ResumeFields'}
        reviewed: {type: boolean, enum: [false]}
    ConfirmResume:
      type: object
      required: [draftId]
      properties:
        draftId: {type: string, format: uuid}
        fullName: {type: string, maxLength: 200}
        phone: {type: string, maxLength: 50}
        experience: {type: string, maxLength: 4000}
        techStack: {type: array, items: {type: string}}
        softSkills: {type: array, items: {type: string}}
        targetRoles: {type: array, items: {type: string}}
        cvHistory: {type: array, items: {$ref: '#/components/schemas/CvEntry'}}
    Option:
      type: object
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    AssessmentCatalogEntry:
      type: object
      required: [id, label, description]
      properties:
        id: {type: string}
        label: {type: string, description: Russian display label}
        description: {type: string}
    AssessmentGrade:
      type: object
      required: [id, label, description, thetaCut, scoreCut]
      properties:
        id: {type: string, enum: [junior, middle, senior]}
        label: {type: string}
        description: {type: string}
        thetaCut: {type: number, description: Cut-point on the ability scale θ (junior = entry level)}
        scoreCut: {type: integer, description: "The same cut on the 0..100 score scale, 100·Φ(thetaCut)"}
    AssessmentVacancy:
      type: object
      required: [id, title, company, specialization, industry, grade, text]
      description: Demo vacancy used to show how a job description becomes a test blueprint.
      properties:
        id: {type: string}
        title: {type: string}
        company: {type: string}
        specialization: {type: string}
        industry: {type: string}
        grade: {type: string, enum: [junior, middle, senior]}
        text: {type: string}
    AssessmentCatalog:
      type: object
      required: [specializations, industries, teamRoles, workFormats, grades, topics, vacancies, testLength, timeLimitMinutes, cooldownDays, decisionMargin, familyCount]
      properties:
        specializations: {type: array, items: {$ref: '#/components/schemas/AssessmentCatalogEntry'}}
        industries: {type: array, items: {$ref: '#/components/schemas/AssessmentCatalogEntry'}}
        teamRoles: {type: array, items: {$ref: '#/components/schemas/AssessmentCatalogEntry'}}
        workFormats: {type: array, items: {$ref: '#/components/schemas/AssessmentCatalogEntry'}}
        grades: {type: array, items: {$ref: '#/components/schemas/AssessmentGrade'}}
        topics: {type: array, items: {$ref: '#/components/schemas/AssessmentCatalogEntry'}}
        vacancies: {type: array, items: {$ref: '#/components/schemas/AssessmentVacancy'}}
        testLength: {type: integer, example: 12}
        timeLimitMinutes: {type: integer, example: 30}
        cooldownDays: {type: integer, example: 90}
        decisionMargin: {type: number, description: "k in the pass rule θ̂ − k·SE ≥ cut"}
        familyCount: {type: integer}
    AssessmentSurvey:
      type: object
      required: [industry, specialization, experienceYears, workFormat]
      description: Survey answered before every attempt; stored with the attempt and copied to the profile (specialization, industry; desiredGrade = targetGrade).
      properties:
        industry: {type: string, description: Catalog industry id}
        specialization: {type: string, enum: [backend, frontend, data, product, design]}
        experienceYears: {type: integer, minimum: 0, maximum: 50}
        teamRoles: {type: array, uniqueItems: true, items: {type: string, description: Catalog team role id}}
        workFormat: {type: string, enum: [office, hybrid, remote]}
    AssessmentStartRequest:
      type: object
      required: [survey, targetGrade]
      properties:
        survey: {$ref: '#/components/schemas/AssessmentSurvey'}
        targetGrade: {type: string, enum: [junior, middle, senior], description: Declared grade the test is for}
        vacancyId: {type: string, nullable: true, description: "Demo vacancy of the same specialization (test for this vacancy)"}
        vacancyText: {type: string, nullable: true, maxLength: 6000, description: Free vacancy text; mutually exclusive with vacancyId}
    AssessmentItem:
      type: object
      required: [topic, topicLabel, prompt, format, options]
      description: One generated task instance. Never contains the answer key.
      properties:
        topic: {type: string}
        topicLabel: {type: string}
        prompt: {type: string}
        code: {type: string, nullable: true}
        language: {type: string, nullable: true}
        format: {type: string, enum: [choice, number], description: "choice: answer with an option id; number: answer with a number (comma or dot)"}
        options: {type: array, items: {$ref: '#/components/schemas/Option'}}
        unit: {type: string, nullable: true}
    AssessmentTopicQuota:
      type: object
      required: [topic, label, weight, items]
      properties:
        topic: {type: string}
        label: {type: string}
        weight: {type: number, description: Normalized blueprint weight}
        items: {type: integer, description: Items of this topic in a test}
    AssessmentAttempt:
      type: object
      required: [attemptId, specialization, industry, targetGrade, startedAt, expiresAt, position, total, blueprint]
      properties:
        attemptId: {type: string, format: uuid}
        specialization: {type: string}
        industry: {type: string}
        targetGrade: {type: string, enum: [junior, middle, senior]}
        vacancyId: {type: string, nullable: true}
        vacancyTitle: {type: string, nullable: true}
        startedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        position: {type: integer, description: 0-based position of the current item = answered items}
        total: {type: integer}
        item: {allOf: [{$ref: '#/components/schemas/AssessmentItem'}], nullable: true}
        blueprint: {type: array, items: {$ref: '#/components/schemas/AssessmentTopicQuota'}}
    AssessmentAnswerRequest:
      type: object
      required: [position, answer]
      properties:
        position: {type: integer, description: Must equal the current item position (protects against double submits)}
        answer: {type: string, minLength: 1, maxLength: 64}
    AssessmentGradeOption:
      type: object
      required: [grade, allowed, reason, message]
      properties:
        grade: {type: string, enum: [junior, middle, senior]}
        allowed: {type: boolean}
        reason: {type: string, enum: [first-attempt, cooldown-over, lower-after-fail, upgrade-after-confident-pass, cooldown, below-confirmed]}
        message: {type: string}
        availableAt: {type: string, format: date-time, nullable: true}
    AssessmentResult:
      type: object
      required: [attemptId, specialization, industry, score, grade, answered, correct, total, expired, startedAt, submittedAt, method, summary, nextOptions]
      properties:
        attemptId: {type: string, format: uuid}
        specialization: {type: string}
        industry: {type: string}
        targetGrade: {type: string, nullable: true, enum: [junior, middle, senior], description: Null for legacy five-question attempts}
        passed: {type: boolean, nullable: true}
        confident: {type: boolean, nullable: true, description: Lower bound also clears the next grade; unlocks an immediate higher-grade attempt}
        theta: {type: number, nullable: true, description: EAP ability estimate}
        thetaSe: {type: number, nullable: true}
        score: {type: integer, minimum: 0, maximum: 100, description: "100·Φ(θ̂)"}
        grade: {type: string, enum: [junior, middle, senior], description: Confirmed grade in the specialization after this attempt (never decreases)}
        previousGrade: {type: string, nullable: true, enum: [junior, middle, senior]}
        answered: {type: integer}
        correct: {type: integer}
        total: {type: integer}
        expired: {type: boolean}
        startedAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time}
        survey: {allOf: [{$ref: '#/components/schemas/AssessmentSurvey'}], nullable: true}
        vacancyId: {type: string, nullable: true}
        vacancyTitle: {type: string, nullable: true}
        method: {type: string, enum: [cat-v1, legacy-v1]}
        summary: {type: string, description: Russian outcome summary}
        nextOptions: {type: array, items: {$ref: '#/components/schemas/AssessmentGradeOption'}, description: Filled for a just-finished attempt}
    AssessmentHistory:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/AssessmentResult'}}
    AssessmentAnswerOutcome:
      type: object
      required: [done]
      description: Correctness of individual answers is never returned.
      properties:
        done: {type: boolean}
        attempt: {allOf: [{$ref: '#/components/schemas/AssessmentAttempt'}], nullable: true}
        result: {allOf: [{$ref: '#/components/schemas/AssessmentResult'}], nullable: true}
    AssessmentCurrent:
      type: object
      properties:
        attempt: {allOf: [{$ref: '#/components/schemas/AssessmentAttempt'}], nullable: true}
        closed: {allOf: [{$ref: '#/components/schemas/AssessmentResult'}], nullable: true, description: Attempt closed by this request because its time ran out}
    AssessmentEligibility:
      type: object
      required: [specialization, options, cooldownDays]
      properties:
        specialization: {type: string}
        confirmedGrade: {type: string, nullable: true, enum: [junior, middle, senior]}
        score: {type: integer, nullable: true}
        lastAttemptAt: {type: string, format: date-time, nullable: true}
        options: {type: array, items: {$ref: '#/components/schemas/AssessmentGradeOption'}}
        openAttemptId: {type: string, format: uuid, nullable: true}
        cooldownDays: {type: integer}
    AssessmentRetakeConflict:
      type: object
      required: [error, reason]
      properties:
        error: {type: string}
        reason: {type: string, enum: [open-attempt, cooldown, below-confirmed]}
        retakeAvailableAt: {type: string, format: date-time, nullable: true}
        openAttemptId: {type: string, format: uuid, nullable: true}
    AssessmentBlueprintRequest:
      type: object
      properties:
        specialization: {type: string, nullable: true, enum: [backend, frontend, data, product, design], description: Detected from the vacancy when omitted}
        vacancyId: {type: string, nullable: true}
        vacancyText: {type: string, nullable: true, maxLength: 6000}
        targetGrade: {type: string, nullable: true, enum: [junior, middle, senior]}
    AssessmentSkill:
      type: object
      required: [id, label, topics, hits, matched]
      properties:
        id: {type: string}
        label: {type: string}
        topics: {type: array, items: {type: string}}
        hits: {type: integer}
        matched: {type: array, items: {type: string}, description: Stemmed vacancy words that matched}
    AssessmentBlueprint:
      type: object
      required: [specialization, targetGrade, skills, uncoveredSkills, topics, sampleItems, poolSize, testLength]
      properties:
        specialization: {type: string}
        detectedSpecialization: {type: string, nullable: true}
        vacancyId: {type: string, nullable: true}
        vacancyTitle: {type: string, nullable: true}
        targetGrade: {type: string}
        skills: {type: array, items: {$ref: '#/components/schemas/AssessmentSkill'}}
        uncoveredSkills: {type: array, items: {$ref: '#/components/schemas/AssessmentSkill'}}
        topics: {type: array, items: {$ref: '#/components/schemas/AssessmentTopicQuota'}}
        sampleItems: {type: array, items: {$ref: '#/components/schemas/AssessmentItem'}, description: Freshly generated example instances without answers}
        poolSize: {type: integer}
        testLength: {type: integer}
    Company:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 2000}
        website: {type: string, maxLength: 500}
    Need:
      type: object
      properties:
        specialization: {type: string, maxLength: 100}
        industry: {type: string, maxLength: 100}
        minGrade: {type: string, enum: [junior, middle, senior]}
        description: {type: string, maxLength: 2000}
    Achievement:
      type: object
      required: [title, issuer, points]
      description: Server-side verified achievement; users cannot submit these through the API.
      properties:
        title: {type: string}
        issuer: {type: string}
        points: {type: integer, minimum: 1, maximum: 20}
    Match:
      type: object
      required: [candidateId, fullName, specialization, grade, score, achievementScore, totalScore, explanation, achievements, techStack]
      properties:
        candidateId: {type: string, format: uuid}
        fullName: {type: string}
        specialization: {type: string}
        grade: {type: string, enum: [junior, middle, senior]}
        score: {type: integer}
        achievementScore: {type: integer, description: Capped at 20}
        totalScore: {type: integer, description: Assessment + verified achievement bonus + industry match bonus}
        explanation: {type: string}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
        techStack: {type: array, items: {type: string}, description: Self-reported skills; never contribute ranking points}
    Matches:
      type: object
      required: [matches]
      properties:
        matches: {type: array, items: {$ref: '#/components/schemas/Match'}}
    InviteRequest:
      type: object
      required: [candidateId, description, salaryMinRub, salaryMaxRub]
      properties:
        candidateId: {type: string, format: uuid}
        description: {type: string, minLength: 1, maxLength: 4000}
        salaryMinRub: {type: integer, minimum: 1}
        salaryMaxRub: {type: integer, minimum: 1, description: Must be at least salaryMinRub}
    Invitation:
      type: object
      required: [id, candidateId, employerId, description, salaryMinRub, salaryMaxRub, status, createdAt, companyName, candidateName]
      properties:
        id: {type: string, format: uuid}
        candidateId: {type: string, format: uuid}
        employerId: {type: string, format: uuid}
        description: {type: string}
        salaryMinRub: {type: integer}
        salaryMaxRub: {type: integer}
        status: {type: string, enum: [sent, viewed, accepted, rejected]}
        createdAt: {type: string, format: date-time}
        companyName: {type: string}
        candidateName: {type: string}
        contactEmail: {type: string, nullable: true, description: Null until candidate accepts}
        contactPhone: {type: string, nullable: true, description: Null until candidate accepts}
    Invitations:
      type: object
      required: [invitations]
      properties:
        invitations: {type: array, items: {$ref: '#/components/schemas/Invitation'}}
  responses:
    BadRequest:
      description: Malformed JSON, invalid fields, missing consent, or invalid PDF.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: Missing, expired, invalid-signature, or incorrect-audience bearer token.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Insufficient role or candidate processing consent.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource does not exist or is not owned by this principal.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Retake cooldown, expired attempt, or invalid invitation status transition.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InternalError:
      description: Unexpected server failure.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /health:
    get:
      summary: Public process liveness check
      security: []
      responses:
        '200': {description: Alive, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /openapi.yaml:
    get:
      summary: Public OpenAPI 3 specification
      security: []
      responses:
        '200': {description: YAML specification, content: {application/yaml: {schema: {type: string}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me:
    get:
      summary: Read own candidate profile (candidate role)
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Update own profile with processingConsent true; publication consent is independent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/consent:
    delete:
      summary: Revoke processing and erase own profile, assessment answers, drafts, achievements and invitations
      description: The blank account remains and can opt in again through PUT /api/candidates/me.
      responses:
        '200': {description: Cleared profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/resume.pdf:
    get:
      summary: Download own standardized branded PDF resume (candidate role)
      description: Requires processing consent and nonblank fullName; generated on demand without persisting PDF. Unicode font is bundled.
      responses:
        '200':
          description: Downloadable PDF resume
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="fsp-resume.pdf"'}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/resume-upload:
    post:
      summary: Extract review-only suggestions from text-based PDF (candidate role, processing consent required)
      description: Exactly one file part named file; at most 5 MB and 30 readable pages. No PDF file persists.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Unreviewed draft, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeDraft'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/candidates/me/resume-confirm:
    post:
      summary: Explicitly review/edit draft fields and save profile; verified email and publication consent stay unchanged
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmResume'}}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Candidate'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/catalog:
    get:
      summary: Survey reference data, grades with cut-points, topics and demo vacancies (any authenticated user)
      responses:
        '200': {description: Catalog, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentCatalog'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/blueprint:
    post:
      summary: Show how a vacancy becomes a test (any authenticated user)
      description: Extracts skills from a demo vacancy or free text (ru/en dictionary with light stemming), turns them into topic weights and item quotas, and returns freshly generated sample items without answers.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentBlueprintRequest'}}}}
      responses:
        '200': {description: Blueprint preview, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentBlueprint'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/eligibility:
    get:
      summary: Which grades the candidate may be tested for now (candidate role)
      description: 90-day cooldown per specialization; immediate lower-grade attempt after a failure and higher-grade attempt after a confident pass; grades below the confirmed one are not offered.
      parameters:
        - {in: query, name: specialization, schema: {type: string, enum: [backend, frontend, data, product, design]}, description: Defaults to the profile specialization}
      responses:
        '200': {description: Eligibility, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentEligibility'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/history:
    get:
      summary: Own completed attempts with survey, target grade, θ, SE, score and confirmed grade, newest first (candidate role)
      responses:
        '200': {description: History, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentHistory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/attempts:
    post:
      summary: Start an adaptive test for the declared grade (candidate role, processing consent required)
      description: Validates the survey, writes specialization/industry/desiredGrade to the profile, builds the blueprint (optionally from a vacancy) and serves the first item. 12 items, 30 minutes; an expired attempt is closed as failed.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentStartRequest'}}}}
      responses:
        '201': {description: Started attempt with its first item, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentAttempt'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: An attempt is already open, the grade is in cooldown, or it is below the confirmed grade
          content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentRetakeConflict'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/attempts/current:
    get:
      summary: Open attempt with its current item, if any (candidate role)
      responses:
        '200': {description: Current attempt or null, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentCurrent'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/assessments/attempts/{id}/answers:
    post:
      summary: Answer the current item; returns the next item or the final result (candidate role)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentAnswerRequest'}}}}
      responses:
        '200': {description: Next item or result (result with expired=true when time ran out), content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentAnswerOutcome'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Attempt already completed, or position is not the current item', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/company:
    get:
      summary: Read own employer company (employer role)
      responses:
        '200': {description: Company, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Update own employer company (employer role)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
      responses:
        '200': {description: Updated company, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/employers/needs:
    get:
      summary: Read own hiring needs (employer role)
      responses:
        '200': {description: Hiring needs, content: {application/json: {schema: {$ref: '#/components/schemas/Need'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      summary: Update own hiring needs (employer role)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Need'}}}}
      responses:
        '200': {description: Updated hiring needs, content: {application/json: {schema: {$ref: '#/components/schemas/Need'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/matches:
    get:
      summary: Search published, assessed candidates (employer role)
      description: Ranked by assessment score + capped verified achievement points (20) + industry match (5). Self-reported skills only filter.
      parameters:
        - {in: query, name: specialization, schema: {type: string}, description: Defaults to employer need specialization}
        - {in: query, name: grade, schema: {type: string, enum: [junior, middle, senior]}, description: Minimum grade; defaults to employer need}
        - {in: query, name: techStack, schema: {type: string}, description: Comma-separated case-insensitive skills; all must match}
        - {in: query, name: verifiedAchievements, schema: {type: boolean}, description: True requires at least one verified achievement}
      responses:
        '200': {description: Ranked matches, content: {application/json: {schema: {$ref: '#/components/schemas/Matches'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/invitations:
    get:
      summary: List own role's invitations (candidate or employer)
      responses:
        '200': {description: Invitations, content: {application/json: {schema: {$ref: '#/components/schemas/Invitations'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      summary: Send invitation to published candidate with mandatory RUB salary range (employer role)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InviteRequest'}}}}
      responses:
        '201': {description: Sent invitation, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/invitations/{id}/view:
    post:
      summary: Invited candidate marks sent invitation viewed
