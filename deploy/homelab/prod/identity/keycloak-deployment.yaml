apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsp-career-keycloak
  namespace: fsp-career
  labels:
    app.kubernetes.io/name: fsp-career-keycloak
    app.kubernetes.io/part-of: fsp-career
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fsp-career-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fsp-career-keycloak
        app.kubernetes.io/part-of: fsp-career
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: goodman
      imagePullSecrets:
        - name: ghcr-registry-fsp-career
      containers:
        - name: keycloak
          image: ghcr.io/06ed/fsp-career-keycloak
          args: [start, --import-realm]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - secretRef:
                name: fsp-career-keycloak-env
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://172.29.240.10:5432/fsp_career_keycloak
            - name: KC_DB_USERNAME
              value: fsp_career_keycloak
            - name: KC_HOSTNAME
              value: https://brokenbrain.online/auth
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: /
            - name: JAVA_OPTS_KC_HEAP
              value: -Xms256m -Xmx512m
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: fsp-career-keycloak-realm
