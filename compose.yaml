# Local development only. Do not expose this stack to untrusted networks.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp_career
      POSTGRES_USER: ${DATABASE_USER:-fsp_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - fsp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-only-keycloak-db}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
    # SMTP remains inside the Compose network; inbox is local-only.

  keycloak:
    build:
      context: ./infra/keycloak
      dockerfile: Dockerfile
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-only-keycloak-db}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/fsp_career
      DATABASE_USER: ${DATABASE_USER:-fsp_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-only-change-me}
      # Tokens are issued to browsers with localhost as `iss`; verify that issuer
      # independently while retrieving the signing keys over the Compose network.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/fsp-career
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/fsp-career/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: fsp-api
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
      FSP_CLIENT_ID: ${FSP_CLIENT_ID:-}
      FSP_CLIENT_SECRET: ${FSP_CLIENT_SECRET:-}
      FSP_ISSUER: ${FSP_ISSUER:-http://localhost:${KEYCLOAK_PORT:-8081}/realms/fsp-career}
      FSP_AUTH_URL: ${FSP_AUTH_URL:-http://localhost:${KEYCLOAK_PORT:-8081}/realms/fsp-career/protocol/openid-connect/auth}
      FSP_TOKEN_URL: ${FSP_TOKEN_URL:-http://keycloak:8080/realms/fsp-career/protocol/openid-connect/token}
      FSP_JWKS_URL: ${FSP_JWKS_URL:-http://keycloak:8080/realms/fsp-career/protocol/openid-connect/certs}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fsp_postgres_data:
  keycloak_postgres_data:
