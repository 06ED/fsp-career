# Server overrides, applied on top of compose.yaml by infra/deploy/deploy.sh.
# Only Traefik is published to the internet (80/443, Let's Encrypt) and routes one origin by labels:
#   /auth/*                   -> Keycloak
#   /api/*, /openapi.yaml     -> API
#   /mail/*                   -> Mailpit demo inbox
#   everything else           -> web
# The ports published in compose.yaml stay bound to the server's loopback interface.
services:
  postgres:
    restart: unless-stopped

  keycloak-db:
    restart: unless-stopped

  mailpit:
    environment:
      MP_WEBROOT: /mail/
    labels:
      # Public demo inbox for Keycloak verification e-mails while no real SMTP is configured
      # (deploy.sh then also disables password reset, which would otherwise allow account takeover).
      - traefik.enable=true
      - traefik.http.routers.fsp-mail.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/mail`)
      - traefik.http.routers.fsp-mail.entrypoints=websecure
      - traefik.http.routers.fsp-mail.tls.certresolver=le
      - traefik.http.services.fsp-mail.loadbalancer.server.port=8025
    restart: unless-stopped

  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: https://${PUBLIC_HOST:?set PUBLIC_HOST in the deploy env file}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Without a cap the JVM sizes its heap from host RAM (~70%), starving builds and the other services.
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    healthcheck:
      # Production mode re-augments the server on start, which is slower than start-dev.
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.http.routers.fsp-auth.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/auth`)
      - traefik.http.routers.fsp-auth.entrypoints=websecure
      - traefik.http.routers.fsp-auth.tls.certresolver=le
      - traefik.http.services.fsp-auth.loadbalancer.server.port=8080
    restart: unless-stopped

  api:
    environment:
      KEYCLOAK_ISSUER: https://${PUBLIC_HOST}/auth/realms/fsp-career
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/fsp-career/protocol/openid-connect/certs
      APP_ENV: production
      FRONTEND_ORIGIN: https://${PUBLIC_HOST}
      API_ORIGIN: https://${PUBLIC_HOST}
      FSP_ISSUER: ${FSP_ISSUER:-https://${PUBLIC_HOST}/auth/realms/fsp-career}
      FSP_AUTH_URL: ${FSP_AUTH_URL:-https://${PUBLIC_HOST}/auth/realms/fsp-career/protocol/openid-connect/auth}
      FSP_TOKEN_URL: ${FSP_TOKEN_URL:-http://keycloak:8080/auth/realms/fsp-career/protocol/openid-connect/token}
      FSP_JWKS_URL: ${FSP_JWKS_URL:-http://keycloak:8080/auth/realms/fsp-career/protocol/openid-connect/certs}
      JAVA_OPTS: -Xmx256m
    labels:
      - traefik.enable=true
      - traefik.http.routers.fsp-api.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api`) || Path(`/openapi.yaml`))
      - traefik.http.routers.fsp-api.entrypoints=websecure
      - traefik.http.routers.fsp-api.tls.certresolver=le
      - traefik.http.services.fsp-api.loadbalancer.server.port=8080
    restart: unless-stopped

  web:
    build:
      args:
        VITE_API_URL: https://${PUBLIC_HOST}
    environment:
      ORIGIN: https://${PUBLIC_HOST}
    labels:
      - traefik.enable=true
      - traefik.http.routers.fsp-web.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.fsp-web.entrypoints=websecure
      - traefik.http.routers.fsp-web.tls.certresolver=le
      - traefik.http.routers.fsp-www.rule=Host(`www.${PUBLIC_HOST}`)
      - traefik.http.routers.fsp-www.entrypoints=websecure
      - traefik.http.routers.fsp-www.tls.certresolver=le
      - traefik.http.routers.fsp-www.middlewares=fsp-www-to-apex
      - traefik.http.middlewares.fsp-www-to-apex.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.fsp-www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.fsp-www-to-apex.redirectregex.permanent=true
      - traefik.http.services.fsp-web.loadbalancer.server.port=3000
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.13
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - web
      - api
      - keycloak
    restart: unless-stopped

volumes:
  traefik_letsencrypt:
