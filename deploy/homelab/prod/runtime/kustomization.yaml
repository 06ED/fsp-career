apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: fsp-career-runtime
      - op: add
        path: /spec/template/spec/preemptionPolicy
        value: Never
      - op: add
        path: /spec/template/spec/priorityClassName
        value: fsp-career
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: None
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          nameservers: [10.43.240.53]
          searches: [fsp-career.svc.cluster.local, svc.cluster.local, cluster.local]
          options:
            - name: ndots
              value: "2"
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
  - target:
      kind: Deployment
      name: fsp-career-api
    patch: |
      - op: replace
        path: /spec/template/spec/securityContext/runAsUser
        value: 10001
      - op: replace
        path: /spec/template/spec/securityContext/runAsGroup
        value: 10001
  - target:
      kind: Job
    patch: |
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: fsp-career-runtime
      - op: add
        path: /spec/template/spec/preemptionPolicy
        value: Never
      - op: add
        path: /spec/template/spec/priorityClassName
        value: fsp-career
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: None
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          nameservers: [10.43.240.53]
          searches: [fsp-career.svc.cluster.local, svc.cluster.local, cluster.local]
          options:
            - name: ndots
              value: "2"
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
